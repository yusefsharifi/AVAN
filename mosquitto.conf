# Mosquitto Configuration for IDOP
# See: https://mosquitto.org/man/mosquitto-conf-5.html

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_dest stdout

# Default listener (for IoT devices)
listener 1883
protocol mqtt

# WebSocket listener (for frontend)
listener 9001
protocol websockets

# Authentication
# In production, enable authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd
allow_anonymous true

# Connection timeout
max_connections -1
